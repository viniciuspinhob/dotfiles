set -g status-style bg='#fffbef',fg='#5c6a72'
set -g window-status-style bg='#fffbef',fg='#a6b0a0'
set -g window-status-current-style bg='#8da101',fg='#fffbef',bold
set -g window-status-activity-style bg='#f85552',fg='#fffbef'
set -g pane-border-style fg='#e6e2cc'
set -g pane-active-border-style fg='#8da101'
set -g message-style bg='#8da101',fg='#fffbef'
set -g message-command-style bg='#8da101',fg='#fffbef'
set -g status-left '#[bg=#35a77c,fg=#fffbef,bold] #S #[bg=#fffbef] '
set -g status-right '#[fg=#a6b0a0]%H:%M #[bg=#3a94c5,fg=#fffbef,bold] %d-%b '
